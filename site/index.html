<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스프링부트4 실습</title>
<meta name="description" content="스프링부트4 실습 — IntelliJ 처럼 코드를 직접 작성·실행·테스트하며 IoC·DI·AOP·PSA·MVC 를 익히는 중간고사 대비 실습 환경 (시뮬레이션)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23000'/%3E%3Cpath d='M5 5h14v3H5zM6 24h10v3H6z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap">
<link rel="stylesheet" href="assets/ide/css/theme.css">
<link rel="stylesheet" href="assets/ide/css/layout.css">
<link rel="stylesheet" href="assets/ide/css/editor.css">
<link rel="stylesheet" href="assets/ide/css/panels.css">
<link rel="stylesheet" href="assets/ide/css/concept.css">
<link rel="stylesheet" href="assets/memo/memo.css">
</head>
<body>
<!-- 아이콘 스프라이트 + 화살표 마커 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-folder" viewBox="0 0 16 16"><path d="M1.5 4.5a1 1 0 0 1 1-1h3l1.5 1.5h6a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1h-10.5a1 1 0 0 1-1-1z"/></symbol>
  <symbol id="i-run" viewBox="0 0 16 16"><path d="M4 2.5v11l9-5.5z" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-stop" viewBox="0 0 16 16"><rect x="3.5" y="3.5" width="9" height="9" rx="1.5" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-rerun" viewBox="0 0 16 16"><path d="M13 8a5 5 0 1 1-1.8-3.8M13 2.5v3h-3"/></symbol>
  <symbol id="i-bulb" viewBox="0 0 16 16"><path d="M6 12.5h4M6.5 14h3M8 1.5a4.5 4.5 0 0 0-2.5 8.2c.4.3.5.7.5 1.3h4c0-.6.1-1 .5-1.3A4.5 4.5 0 0 0 8 1.5z"/></symbol>
  <symbol id="i-play" viewBox="0 0 16 16"><path d="M5 2.8v10.4L13.5 8z" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-pause" viewBox="0 0 16 16"><rect x="3.5" y="3" width="3.2" height="10" rx="1" fill="currentColor" stroke="none"/><rect x="9.3" y="3" width="3.2" height="10" rx="1" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-prev" viewBox="0 0 16 16"><path d="M12.5 3v10L5.5 8z" fill="currentColor" stroke="none"/><rect x="2.5" y="3" width="2" height="10" rx="1" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-next" viewBox="0 0 16 16"><path d="M3.5 3v10l7-5z" fill="currentColor" stroke="none"/><rect x="11.5" y="3" width="2" height="10" rx="1" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-test" viewBox="0 0 16 16"><path d="M6 2h4M7 2v4.6L3.4 12.6A1.2 1.2 0 0 0 4.4 14.4h7.2a1.2 1.2 0 0 0 1-1.8L9 6.6V2"/><path d="M5 10.5h6"/></symbol>
  <symbol id="i-commit" viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.6"/><path d="M1.5 8h4M10.5 8h4"/></symbol>
  <symbol id="i-menu" viewBox="0 0 16 16"><path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h11"/></symbol>
  <symbol id="i-chev" viewBox="0 0 16 16"><path d="M4 6l4 4 4-4"/></symbol>
  <symbol id="i-branch" viewBox="0 0 16 16"><circle cx="4.5" cy="3.5" r="1.5"/><circle cx="4.5" cy="12.5" r="1.5"/><circle cx="11.5" cy="6" r="1.5"/><path d="M4.5 5v6M11.5 7.5c0 2-3 2-7 3.5"/></symbol>
  <symbol id="i-check" viewBox="0 0 16 16"><rect x="2.5" y="2.5" width="11" height="11" rx="2"/><path d="M5.5 8l2 2 3.5-4"/></symbol>
  <symbol id="i-warn" viewBox="0 0 16 16"><path d="M8 2l6.5 11.5h-13z"/><path d="M8 6.5v3M8 11.5v.1"/></symbol>
  <symbol id="i-term" viewBox="0 0 16 16"><rect x="1.5" y="2.5" width="13" height="11" rx="2"/><path d="M4.5 6l2.5 2-2.5 2M8.5 10.5h3"/></symbol>
  <symbol id="i-http" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M2 8h12M8 2c2 2 2 10 0 12M8 2c-2 2-2 10 0 12"/></symbol>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7d8590"/></marker>
  <marker id="arO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e0a030"/></marker>
  <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d65a5a"/></marker>
</defs></svg>

<div class="ide">
  <!-- 메인 툴바 -->
  <header class="toolbar">
    <button class="tbtn" title="Main Menu"><svg class="ic"><use href="#i-menu"/></svg></button>
    <button class="widget" title="Project"><span class="av">B</span><b>blog</b><svg class="ic chev"><use href="#i-chev"/></svg></button>
    <button class="widget" id="btn-branch" title="Git — Commit 도구창 열기 (Ctrl+K)"><svg class="ic"><use href="#i-branch"/></svg><span class="bn">main</span><svg class="ic chev"><use href="#i-chev"/></svg></button>
    <span class="spacer"></span>
    <button class="pillbtn hot" id="btn-concepts" title="개념 애니메이션 보기 (코드가 타이핑되고 그림이 움직여요)"><span>💡</span><b class="lbl">개념 애니메이션</b></button>
    <button class="pillbtn" id="btn-ann" title="어노테이션 암기 (카드·퀴즈·빈칸)"><span>🧠</span><b class="lbl">어노테이션 암기</b></button>
    <button class="pillbtn alt" id="btn-exam" title="모의고사"><span>📝</span><b class="lbl">모의고사</b></button>
    <button class="tbtn testbtn" id="btn-test" title="테스트 실행 — 모든 테스트 (Run Tests)"><svg class="ic"><use href="#i-test"/></svg><b class="lbl">테스트</b></button>
    <span id="srv" class="off">Stopped</span>
    <div class="runwidget">
      <span class="cfg"><svg class="ic"><use href="#i-term"/></svg>BlogApplication<svg class="ic chev"><use href="#i-chev"/></svg></span>
      <button class="rbtn run" id="btn-run" title="Run 'BlogApplication' (Shift+F10)"><svg class="ic"><use href="#i-run"/></svg></button>
      <button class="rbtn" id="btn-rerun" title="Rerun"><svg class="ic"><use href="#i-rerun"/></svg></button>
      <button class="rbtn stop" id="btn-stop" title="Stop (Ctrl+F2)" disabled><svg class="ic"><use href="#i-stop"/></svg></button>
    </div>
  </header>

  <!-- 좌측 스트립 -->
  <nav class="stripe" id="ls" aria-label="도구창">
    <button class="sb on" id="sb-project" title="Project"><svg class="ic"><use href="#i-folder"/></svg></button>
    <button class="sb" id="sb-git" title="Commit (Ctrl+K)"><svg class="ic"><use href="#i-commit"/></svg></button>
    <button class="sb" id="sb-concepts" title="Concepts — 개념 애니메이션"><svg class="ic"><use href="#i-bulb"/></svg></button>
    <span class="sp"></span>
    <button class="sb" data-console="run" title="Run"><svg class="ic"><use href="#i-term"/></svg></button>
    <button class="sb" data-console="tests" title="Tests"><svg class="ic"><use href="#i-test"/></svg></button>
    <button class="sb" data-console="http" title="HTTP Response"><svg class="ic"><use href="#i-http"/></svg></button>
    <button class="sb" data-console="problems" title="Problems"><svg class="ic"><use href="#i-warn"/></svg></button>
  </nav>

  <aside class="tw" id="ltw"><div class="twh"><span id="ltw-title">Project</span><button class="tbtn nfb" id="btn-newfile" title="새 Java 파일 만들기 (직접 코드를 처음부터 짜 보세요)">＋ New</button></div><div class="twb" id="tree"></div><div class="twb" id="clist" hidden></div><div class="twb" id="gitpane" hidden></div></aside>

  <main class="center" id="center">
    <div id="tabs"></div>
    <div id="editor"></div>
    <div id="concept" hidden></div>
    <section id="console"></section>
  </main>

  <aside class="tw" id="rtw"><div class="twh"><span>Tasks</span></div><div class="twb" id="missions"></div></aside>

  <!-- 우측 스트립 -->
  <nav class="stripe" id="rs" aria-label="도구창(오른쪽)">
    <button class="sb on" id="sb-tasks" title="Tasks"><svg class="ic"><use href="#i-check"/></svg></button>
  </nav>

  <footer class="status"><span class="sw" id="st-git">⎇ main</span><span class="sw" id="st-file"></span><span class="sp"></span><span class="sw" id="st-prob">✔ No problems</span><span class="sw" id="st-pos">1:1</span><span class="sw">LF</span><span class="sw">UTF-8</span><span class="sw">4 spaces</span><span class="sw">Java 21</span></footer>
</div>
<div id="toast" role="status"></div>
<div id="modal" hidden><div class="mbox"><div class="mtitle">정답 코드</div><div class="mbody"></div></div></div>

<!-- 데이터 -->
<script src="assets/data/annotations.js"></script>
<script src="assets/data/steps.js"></script>
<script src="assets/data/exam.js"></script>

<script src="assets/ide/core/constants.js"></script>
<script src="assets/ide/core/util.js"></script>
<script src="assets/ide/core/parser.js"></script>

<!-- project: 시작 코드 / 정답 / 미션 -->

<!-- ui -->
<script src="assets/ide/ui/state.js"></script>

<script src="assets/ide/ui/editor.js"></script>
<script src="assets/ide/concepts/player.js"></script>
<!-- memo: 어노테이션 암기 / 모의고사 -->
<script src="assets/memo/core.js"></script>

<script src="assets/ide/runner.js"></script>
<script src="assets/ide/ui/main.js"></script>
</body>
</html>
